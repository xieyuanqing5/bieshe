{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card mx-auto shadow-sm" style="max-width: 420px; border-radius: 16px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-3">🔐 관리자 로그인</h3>

            <form id="adminLoginForm">
                <label class="form-label">아이디</label>
                <input type="text" name="username" class="form-control" required>

                <label class="form-label mt-3">비밀번호</label>
                <input type="password" name="password" class="form-control" required>

                <button type="submit" class="btn btn-warning mt-4 w-100">
                    관리자 로그인
                </button>
            </form>

            <p id="msg" class="text-danger text-center mt-3 mb-0"></p>
        </div>
    </div>
</div>

<script>
document.getElementById("adminLoginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const msgBox = document.getElementById("msg");
    msgBox.innerText = "";

    const data = {
        username: this.username.value.trim(),
        password: this.password.value
    };

    try {
        const res = await fetch("/auth/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
            alert("관리자 로그인 성공!");
            window.location.href = "/admin/dashboard";
        } else {
            msgBox.innerText = result.error || "로그인에 실패했습니다.";
        }
    } catch (error) {
        msgBox.innerText = "서버 연결 오류가 발생했습니다.";
        console.error(error);
    }
});
</script>
{% endblock %}
