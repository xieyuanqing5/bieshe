{% extends "layout.html" %}
{% block body %}

<!-- 🔙 返回 -->
<div class="mt-3">
    <button onclick="history.back()" class="btn btn-outline-secondary">
        ←
    </button>
</div>

<h3 class="text-center mb-4">📦 관리자 물품 관리</h3>

<div class="d-flex justify-content-between mb-3">
    <div>
        <a href="/admin/items?type=all" class="btn btn-secondary btn-sm">전체</a>
        <a href="/admin/items?type=lost" class="btn btn-warning btn-sm">분실물</a>
        <a href="/admin/items?type=found" class="btn btn-success btn-sm">습득물</a>
    </div>
</div>

{% if type == "all" %}

    <h4>🟡 분실물</h4>
            <th>ID</th>
            <th>제목</th>
            <th>작성자</th>
        <th>상태</th>
            <th>등록일</th>
            <th>작업</th>
        </tr>

        {% for item in items.lost %}
            <td>{{ item.id }}</td>
            <td>
            <button class="btn btn-sm"
                    id="status-lost-{{ item.id }}"
                    onclick="toggleStatus('lost', {{ item.id }})">
                {% if item.resolved %}
                    <span class="badge bg-success">완료</span>
                {% else %}
                    <span class="badge bg-danger">미완료</span>
                {% endif %}
            </button>
        </td>

        <td>{{ item.date or "-" }}</td>

        <td>
                <button class="btn btn-danger btn-sm"
            </td>
        </tr>
        {% endfor %}
    </table>

    <h4 class="mt-4">🟢 습득물</h4>
            <th>ID</th>
            <th>제목</th>
            <th>작성자</th>
        <th>상태</th>
            <th>등록일</th>
            <th>작업</th>
        </tr>

        {% for item in items.found %}
            <td>{{ item.id }}</td>
            <td>
            </td>
        </tr>
        {% endfor %}
    </table>


    {% for item in items %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.title }}</td>
        <td>{{ item.user.username }}</td>
        <td>{{ item.date }}</td>
        <td>
            <button class="btn btn-danger btn-sm"
        </td>
    </tr>
    {% endfor %}
</table>

{% endif %}

<script>
/* 删除（无刷新） */
function deleteItem(type, id) {
    if (!confirm("정말 삭제하시겠습니까?")) return;

    fetch(`/admin/items/${type}/${id}/delete`, {
        method: "POST"
      .then(data => {
    });
}
</script>

{% endblock %}
